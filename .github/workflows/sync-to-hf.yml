name: Sync to Hugging Face Space

# Mirrors the app to the Hugging Face Space on every push to main, so the
# Space never has to be updated by hand. Uploads with huggingface_hub rather
# than a git force-push, which keeps the Space's own README (its sdk front
# matter) intact and preserves folders like sources/ that the browser
# uploader drops.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "huggingface_hub>=0.24,<1.0"
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import upload_folder

          upload_folder(
              repo_id="pawankapkoti/forthepeople-uk",
              repo_type="space",
              folder_path=".",
              token=os.environ["HF_TOKEN"],
              commit_message=f"Sync from GitHub {os.environ.get('GITHUB_SHA', '')[:7]}",
              ignore_patterns=[
                  "tests/*", ".github/*", "README.md",
                  "**/__pycache__/*", "*.pyc", ".cache/*", ".git/*",
              ],
          )
          PY
