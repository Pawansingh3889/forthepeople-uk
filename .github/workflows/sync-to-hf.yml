name: Sync to Hugging Face Space

# Mirrors the app to the Hugging Face Space on every push to main, so the
# Space never has to be updated by hand. Uploads with huggingface_hub rather
# than a git force-push, which keeps the Space's own README (its sdk front
# matter) intact and preserves folders like sources/ that the browser
# uploader drops.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "huggingface_hub>=0.24"
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli upload pawankapkoti/forthepeople-uk . . \
            --repo-type=space \
            --commit-message="Sync from GitHub ${GITHUB_SHA::7}" \
            --exclude="tests/*" \
            --exclude=".github/*" \
            --exclude="README.md" \
            --exclude="__pycache__/*" \
            --exclude="**/__pycache__/*" \
            --exclude=".cache/*" \
            --exclude="*.pyc"
